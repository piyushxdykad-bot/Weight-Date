<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preload" as="image" href="site/frames/f_001.webp">
<title>The Weight Date</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: an app shell (sidebar on desktop, bottom tabs on phone). The Home view reads like a landing page built from app cards;
   every other view is a working tool. Dark carbon floor, ember red = the 25 kg plate, brass = medals. */
:root{
  color-scheme:dark;
  --ink:#0d0b0b; --iron:#161313; --steel:#1d1817; --graphite:#2a2423;
  --chalk:#efe8df; --ash:#9b918b; --ember:#d2311f; --oxblood:#6d140e; --brass:#c8a66a; --ok:#5bd08a; --warn:#e8b04a;
  --line:rgba(239,232,223,.10);
  --f-d:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --f-s:"Instrument Serif",Georgia,serif;
  --f-b:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --f-m:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --side:264px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--chalk);font:400 15px/1.5 var(--f-b);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
input,select,textarea{font:inherit;color:var(--chalk)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}
img{max-width:100%;display:block}
.num{font-variant-numeric:tabular-nums}
#root{height:100%}

/* ---------- shell ---------- */
.shell{height:100%;display:grid;grid-template-columns:var(--side) minmax(0,1fr)}
.side{height:100%;border-right:1px solid var(--line);background:linear-gradient(180deg,var(--iron),var(--ink));display:flex;flex-direction:column;padding:22px 16px calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:22px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font:900 22px/1 var(--f-d);text-transform:uppercase;letter-spacing:.03em;text-decoration:none;padding:4px 8px}
.brand i{font:italic 400 22px/1 var(--f-s);color:var(--ember);text-transform:none;letter-spacing:0}
.nav-group{display:grid;gap:2px}
.nav-group>span{font:600 10px/1 var(--f-m);letter-spacing:.18em;text-transform:uppercase;color:var(--ash);padding:0 10px 8px}
.nav-a{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:14px;text-decoration:none;color:var(--ash);font-weight:500;transition:background .3s,color .3s;position:relative}
.nav-a:hover{background:rgba(239,232,223,.04);color:var(--chalk)}
.nav-a[aria-current="page"]{background:rgba(239,232,223,.07);color:var(--chalk)}
.nav-a[aria-current="page"]::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--ember)}
.nav-a[aria-current="page"] svg{color:var(--ember)}
.nav-a .lock{margin-left:auto;opacity:.5}
.side-foot{margin-top:auto;display:grid;gap:10px}
.who{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;border:1px solid var(--line);background:var(--ink)}
.main{height:100%;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.main::-webkit-scrollbar{width:10px}.main::-webkit-scrollbar-thumb{background:var(--graphite);border-radius:10px;border:3px solid var(--ink)}
.page{max-width:1180px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 80px clamp(16px,3vw,40px);display:grid;gap:22px}
.mtop,.mtabs{display:none}
@media (max-width:960px){
  .shell{display:block}
  .side{display:none}
  .mtop{display:flex;position:sticky;top:0;z-index:30;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--ink) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .mtabs{display:grid;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));height:66px;border-radius:24px;background:color-mix(in srgb,var(--steel) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);grid-template-columns:repeat(5,1fr);padding:6px;z-index:30}
  .mtab{display:grid;place-items:center;gap:2px;border-radius:18px;color:var(--ash);font:600 9.5px/1 var(--f-m);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;padding-top:6px}
  .mtab svg{width:21px;height:21px}
  .mtab[aria-current="page"]{color:var(--chalk);background:rgba(239,232,223,.06)}
  .mtab[aria-current="page"] svg{color:var(--ember)}
  .page{padding:16px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px));gap:16px}
}

/* ---------- atoms ---------- */
.card{background:var(--iron);border:1px solid var(--line);border-radius:24px;padding:20px;display:grid;gap:12px;min-width:0;align-content:start}
.card.hot{background:radial-gradient(120% 100% at 100% 0%,rgba(210,49,31,.32),transparent 60%),linear-gradient(180deg,var(--steel),var(--iron));border-color:rgba(210,49,31,.35)}
a.card,button.card{text-align:left;text-decoration:none;transition:transform .5s var(--ease),border-color .3s}
a.card:hover,button.card:hover{transform:translateY(-3px);border-color:rgba(239,232,223,.2)}
.k{font:600 10.5px/1.2 var(--f-m);letter-spacing:.16em;text-transform:uppercase;color:var(--ash)}
.k.brass{color:var(--brass)}
.big{font:900 44px/.86 var(--f-d)}
.h1{font:900 clamp(40px,5vw,72px)/.86 var(--f-d);text-transform:uppercase;margin:0;text-wrap:balance}
.h2{font:900 clamp(30px,3.2vw,44px)/.9 var(--f-d);text-transform:uppercase;margin:0;text-wrap:balance}
.h3{font:800 22px/1 var(--f-d);text-transform:uppercase;margin:0}
.it{font:italic 400 1.06em/.9 var(--f-s);color:var(--ember);text-transform:none;letter-spacing:-.01em}
.muted{color:var(--ash)}
.lead{color:var(--ash);font-size:17px;max-width:56ch;margin:0}
.stack{display:grid;gap:14px;min-width:0}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g3,.g2.st{grid-template-columns:1fr}.g4{gap:10px}.g2{gap:10px}}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:50px;padding:0 22px;border-radius:999px;background:var(--ember);color:var(--chalk);font:600 12px/1 var(--f-m);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;transition:transform .2s var(--ease),background .3s,opacity .3s;white-space:nowrap}
.btn:hover{background:#e03a27}
.btn:active{transform:scale(.97)}
.btn.full{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(239,232,223,.05)}
.btn.light{background:var(--chalk);color:var(--ink)}
.btn.brass{background:var(--brass);color:var(--ink)}
.btn.sm{height:38px;padding:0 14px;font-size:10.5px}
.btn[disabled]{opacity:.4;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font:600 10px/1 var(--f-m);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);color:var(--ash);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:rgba(91,208,138,.35)}
.pill.ok::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(91,208,138,.6)}100%{box-shadow:0 0 0 8px rgba(91,208,138,0)}}
.pill.warn{color:var(--warn);border-color:rgba(232,176,74,.4)}
.pill.red{color:#ff8a7a;border-color:rgba(210,49,31,.5)}
.pill.solid{background:var(--ember);color:var(--chalk);border-color:var(--ember)}
.seg{display:flex;padding:4px;border-radius:999px;background:var(--iron);border:1px solid var(--line);gap:4px;overflow-x:auto;max-width:100%}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:10px 14px;border-radius:999px;font:600 10.5px/1 var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--ash);transition:all .3s var(--ease);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--chalk);color:var(--ink)}
.field{display:grid;gap:8px;min-width:0}
.field>span{font:600 10.5px/1 var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.input{display:flex;align-items:center;height:52px;border-radius:16px;background:var(--ink);border:1px solid var(--line);padding:0 14px;gap:8px;transition:border-color .3s;min-width:0}
.input:focus-within{border-color:var(--brass)}
.input input,.input select{flex:1;min-width:0;width:100%;background:transparent;border:0;outline:none;font-size:16px;color-scheme:dark}
.input select option{background:var(--iron)}
.input em{font:500 12px/1 var(--f-m);color:var(--ash);font-style:normal}
textarea.ta{width:100%;min-height:90px;background:var(--ink);border:1px solid var(--line);border-radius:16px;padding:12px 14px;outline:none;resize:vertical;font-size:15px}
.bar{height:8px;border-radius:999px;background:var(--graphite);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--brass),var(--ember));transition:width .9s var(--ease)}
.list{display:grid;border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);min-width:0;text-align:left;width:100%}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600}
.li .t small{color:var(--ash);font-size:13px}
.avatar{width:44px;height:44px;border-radius:50%;flex:0 0 44px;background:var(--graphite) center/cover;display:grid;place-items:center;font:800 17px/1 var(--f-d);color:var(--brass);border:1px solid var(--line)}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto;position:relative}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--ember);box-shadow:0 0 0 2px var(--ink)}
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.view>*{animation:vin .75s var(--ease) both}
.view>*:nth-child(2){animation-delay:0.06s}.view>*:nth-child(3){animation-delay:0.12s}.view>*:nth-child(4){animation-delay:0.18s}.view>*:nth-child(5){animation-delay:0.24s}.view>*:nth-child(6){animation-delay:0.30s}.view>*:nth-child(7){animation-delay:0.36s}.view>*:nth-child(8){animation-delay:0.42s}
@keyframes vin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.reveal{animation:vin .8s var(--ease) both}
.photo{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:var(--iron) center/cover;min-height:180px}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.photo:hover img{transform:scale(1.05)}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(13,11,11,.92))}
.photo .cap{position:absolute;left:18px;right:18px;bottom:16px;z-index:1;display:grid;gap:6px}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:-2px}
.hscroll>*{scroll-snap-align:start}
.hscroll::-webkit-scrollbar{height:6px}.hscroll::-webkit-scrollbar-thumb{background:var(--graphite);border-radius:6px}

/* ---------- home / landing ---------- */
.hero{position:relative;border-radius:30px;overflow:hidden;border:1px solid var(--line);min-height:min(620px,78vh);display:flex;align-items:flex-end;isolation:isolate}
.hero video,.hero .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 50%;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(13,11,11,.92) 0%,rgba(13,11,11,.65) 38%,rgba(13,11,11,.1) 70%),linear-gradient(180deg,transparent 50%,rgba(13,11,11,.85))}
.hero-in{padding:clamp(22px,4vw,48px);display:grid;gap:22px;max-width:640px}
.hero h1{margin:0;font:900 clamp(60px,8.4vw,128px)/.82 var(--f-d);text-transform:uppercase}
.hero h1 .it{font-size:1.12em}
.float{position:absolute;z-index:1;padding:14px 16px;border-radius:18px;background:color-mix(in srgb,var(--ink) 70%,transparent);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;gap:4px;animation:bob 6s ease-in-out infinite}
.float b{font:900 30px/1 var(--f-d)}
@keyframes bob{50%{transform:translateY(-8px)}}
@media (max-width:760px){.hero{min-height:560px}.hero::after{background:linear-gradient(180deg,rgba(13,11,11,.35) 0%,rgba(13,11,11,.55) 40%,rgba(13,11,11,.95) 100%)}.float{display:none}}
.qa{display:grid;gap:14px;padding:18px;border-radius:22px;border:1px solid var(--line);background:var(--iron);text-decoration:none;transition:transform .5s var(--ease),border-color .3s,background .3s;min-width:0}
.qa:hover{transform:translateY(-4px);border-color:rgba(210,49,31,.45);background:var(--steel)}
.qa .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(210,49,31,.14);color:var(--ember)}
.qa b{font:800 20px/1 var(--f-d);text-transform:uppercase}
.qa small{color:var(--ash);font-size:13px}
.marq{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.marq-t{display:flex;gap:14px;width:max-content;animation:mq 60s linear infinite}
.marq:hover .marq-t{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.rev{width:min(360px,80vw);flex:0 0 auto;margin:0}
.rev blockquote{margin:0;font:italic 400 21px/1.25 var(--f-s)}
.stars{color:var(--brass);letter-spacing:.2em;font-size:13px}
.appmock{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center}
.mock{border-radius:30px;border:1px solid rgba(239,232,223,.14);background:var(--ink);padding:16px;display:grid;gap:10px;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 60px rgba(210,49,31,.12);max-width:360px;justify-self:center;width:100%;transform:rotate(2deg)}
@media (max-width:860px){.appmock{grid-template-columns:1fr}.mock{transform:none}}

/* ---------- tools ---------- */
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daystrip button{display:grid;gap:4px;justify-items:center;padding:10px 0;border-radius:16px;border:1px solid var(--line);font:600 10px/1 var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--ash)}
.daystrip button b{font:800 18px/1 var(--f-d);color:var(--chalk)}
.daystrip button[aria-pressed="true"]{background:var(--ember);border-color:var(--ember);color:var(--chalk)}
.daystrip button.done::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--ok)}
.ex{background:var(--iron);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:12px;min-width:0}
.ex.complete{border-color:rgba(91,208,138,.35)}
.ex h4{margin:0;font:800 20px/1 var(--f-d);text-transform:uppercase}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.set{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;font:800 16px/1 var(--f-d);transition:all .3s var(--ease)}
.set small{font:500 9px/1 var(--f-m);color:var(--ash)}
.set[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--ink)}
.set[aria-pressed="true"] small{color:var(--ink)}
.kg{display:flex;align-items:center;gap:6px}
.kg button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);font-size:18px;line-height:1}
.kg b{min-width:56px;text-align:center;font:800 20px/1 var(--f-d)}
.coach-note{border-left:2px solid var(--brass);padding:4px 0 4px 12px;font:italic 400 19px/1.25 var(--f-s);margin:0}
.meal{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px;border-radius:20px;border:1px solid var(--line);background:var(--iron);text-align:left;width:100%;transition:all .3s var(--ease)}
.meal .tick{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ash);display:grid;place-items:center}
.meal[aria-pressed="true"]{border-color:rgba(91,208,138,.35)}
.meal[aria-pressed="true"] .tick{background:var(--ok);border-color:var(--ok);color:var(--ink)}
.meal b{display:block;font-weight:600}
.glasses{display:flex;gap:6px;flex-wrap:wrap}
.glass{width:24px;height:34px;border-radius:4px 4px 8px 8px;border:1.5px solid var(--line);position:relative;overflow:hidden}
.glass i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#6fb0ff,#2f6fd0);transition:height .5s var(--ease)}
.glass.on i{height:80%}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal span{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font:600 11px/1 var(--f-m);color:var(--ash);background:var(--ink);max-height:52px}
.cal span.h{background:var(--ember);color:var(--chalk)}
.cal span.t{outline:1.5px solid var(--brass)}
.cal span.x{opacity:.25}
.cal .dn{background:none}
.crowd{display:flex;align-items:flex-end;gap:4px;height:80px}
.crowd i{flex:1;border-radius:4px 4px 2px 2px;background:var(--graphite)}
.crowd i.b{background:linear-gradient(180deg,var(--ember),var(--oxblood))}
.crowd i.now{outline:1.5px solid var(--brass);outline-offset:2px}
.crowd-lbl{display:flex;justify-content:space-between;font:500 10px/1 var(--f-m);color:var(--ash)}
.scale-bar{position:relative;height:10px;border-radius:999px;background:var(--graphite)}
.scale-bar i{position:absolute;top:0;bottom:0}
.scale-bar b{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--chalk);box-shadow:0 0 0 5px rgba(13,11,11,.8);transition:left .9s var(--ease)}
.edit-ex{display:grid;grid-template-columns:minmax(0,1fr) 56px 64px 64px 32px;gap:6px;align-items:center}
.edit-ex input{height:40px;border-radius:12px;background:var(--ink);border:1px solid var(--line);padding:0 10px;outline:none;min-width:0;width:100%;font-size:14px}
.edit-ex .hd{font:600 9.5px/1 var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
.x-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);color:var(--ash);display:grid;place-items:center}
.mtile{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:20px;border:1px solid var(--line);background:var(--iron);width:100%;text-align:left}
.qr{background:var(--chalk);border-radius:18px;padding:14px;display:grid;place-items:center}
.faq{border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line);padding:16px 0}
.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";color:var(--ember);font:600 20px/1 var(--f-m)}
.faq details[open] summary::after{content:"−"}
.faq p{margin:10px 0 0;color:var(--ash)}
.demo-flag{font:600 9.5px/1.4 var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;background:var(--chalk);color:var(--ink);padding:12px 18px;border-radius:999px;font:600 12px/1 var(--f-m);letter-spacing:.06em;white-space:nowrap;animation:tin .4s var(--ease) both;max-width:90%;overflow:hidden;text-overflow:ellipsis}
@media (max-width:960px){.toast{bottom:96px}}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}

/* spotlight */
.card,.qa,.mtile,.ex{position:relative;isolation:isolate}
.card::before,.qa::before,.mtile::before,.ex::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;opacity:0;transition:opacity .45s;background:radial-gradient(460px circle at var(--mx,50%) var(--my,50%),rgba(210,49,31,.18),transparent 45%)}
.card:hover::before,.qa:hover::before,.mtile:hover::before,.ex:hover::before{opacity:1}
/* scrub hero */
.hero-wrap{height:200vh;position:relative}
.hero-wrap .hero{position:sticky;top:20px;height:calc(100vh - 56px);min-height:520px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.hero-progress{position:absolute;left:clamp(22px,4vw,48px);right:clamp(22px,4vw,48px);top:18px;height:2px;background:rgba(239,232,223,.12);border-radius:2px;z-index:1;overflow:hidden}
.hero-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--ember));transform-origin:left;transform:scaleX(0)}
.frame-n{position:absolute;left:clamp(22px,4vw,48px);top:30px;z-index:1;font:500 10.5px/1 var(--f-m);letter-spacing:.16em;color:var(--ash)}
.hero-end{position:absolute;right:clamp(22px,4vw,48px);bottom:clamp(22px,4vw,48px);z-index:1;text-align:right;display:grid;gap:10px;justify-items:end;opacity:0;transform:translateY(24px);pointer-events:none}
.hero-end b{font:900 clamp(60px,8.4vw,128px)/.82 var(--f-d);text-transform:uppercase}
.hero-in,.float{will-change:opacity,transform}
.split .ch{display:inline-block;animation:rise 1s var(--ease) both;animation-delay:calc(var(--i) * 38ms + .1s)}
@keyframes rise{from{opacity:0;transform:translateY(55%) rotate(5deg)}}
.scroll-hint{display:inline-flex;align-items:center;gap:10px;font:600 10.5px/1 var(--f-m);letter-spacing:.16em;text-transform:uppercase;color:var(--ash)}
.scroll-hint i{width:1px;height:28px;background:linear-gradient(var(--ember),transparent);animation:hint 1.8s var(--ease) infinite}
@keyframes hint{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@media (max-width:960px){.hero-wrap{height:175vh}.hero-wrap .hero{top:70px;height:calc(100svh - 168px);min-height:480px}.frame-n{display:none}}
/* band */
.band{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--line);gap:1px}
.band>div{background:var(--iron);padding:20px;display:grid;gap:6px;min-width:0}
.band b{font:900 clamp(40px,4.4vw,64px)/.85 var(--f-d)}
@media (max-width:760px){.band{grid-template-columns:1fr 1fr}}
/* command palette */
.cmdk{position:fixed;z-index:70;left:50%;top:14vh;transform:translateX(-50%);width:min(620px,calc(100% - 32px));background:var(--steel);border:1px solid rgba(239,232,223,.16);border-radius:22px;box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 1px rgba(210,49,31,.1);overflow:hidden;animation:cin .32s var(--ease) both}
@keyframes cin{from{opacity:0;transform:translate(-50%,-12px) scale(.98)}}
.cmdk input{width:100%;height:62px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:0 20px;font-size:17px;outline:none}
.cmdk ul{list-style:none;margin:0;padding:8px;max-height:52vh;overflow-y:auto}
.cmdk li button{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;text-align:left;color:var(--ash)}
.cmdk li button[aria-selected="true"]{background:rgba(239,232,223,.07);color:var(--chalk)}
.cmdk li button[aria-selected="true"] svg{color:var(--ember)}
.cmdk kbd,.searchbtn kbd{margin-left:auto;font:500 10px/1 var(--f-m);color:var(--ash);border:1px solid var(--line);border-radius:6px;padding:4px 6px;white-space:nowrap}
.searchbtn{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:var(--ink);color:var(--ash);width:100%;font-size:14px;transition:border-color .3s}
.searchbtn:hover{border-color:rgba(239,232,223,.22)}
/* plates */
.pl{animation:slide .5s var(--ease) both;animation-delay:var(--d)}
@keyframes slide{from{opacity:0;transform:translateY(-16px)}}
/* focus mode */
.focus{position:fixed;inset:0;z-index:65;background:radial-gradient(80% 60% at 50% 0%,rgba(210,49,31,.28),transparent 60%),var(--ink);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:fi .35s both;overflow-y:auto}
.focus-in{flex:1;display:grid;place-content:center;justify-items:center;text-align:center;gap:20px;max-width:680px;margin:0 auto;width:100%;animation:vin .5s var(--ease) both;padding-block:20px}
.focus .exname{font:900 clamp(48px,9vw,112px)/.85 var(--f-d);text-transform:uppercase;text-wrap:balance}
.focus .dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.focus .dots i{width:30px;height:6px;border-radius:6px;background:var(--graphite);transition:background .4s}
.focus .dots i.on{background:var(--ok)}
.focus .dots i.cur{background:var(--ember)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;width:100%;height:100%}
/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.badge{display:grid;justify-items:center;gap:6px;text-align:center;padding:16px 10px;border-radius:20px;border:1px solid var(--line);background:var(--ink);transition:transform .4s var(--ease)}
.badge:hover{transform:translateY(-3px)}
.badge .md{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:radial-gradient(circle at 35% 30%,#f2d79a,var(--brass) 55%,#7a5a28);box-shadow:inset 0 -6px 10px rgba(0,0,0,.3),inset 0 3px 6px rgba(255,255,255,.35)}
.badge.off{opacity:.35}
.badge.off .md{background:var(--graphite);color:var(--ash);box-shadow:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}.hero-wrap{height:auto}.hero-wrap .hero{position:relative;top:0}}
</style>

<body>

<script src="https://cdn.jsdelivr.net/npm/preact@10.19.3/dist/preact.umd.js"></script>

(function(){

/* ---------- dates (IST) ---------- */

const REVIEWS=[['Isha Singh','Civil Lines','Training with Sujeet sir has been the highlight. Exceptionally knowledgeable PT.'],['Shraddha Rastogi','Civil Lines','Women-friendly environment, and the trainers are very supportive.'],['Shreya Srivastava','Tagore Town','Free diet charts and a schedule updated every 2–3 months. A big plus.'],['Harsh Mishra','Tagore Town','The hygiene is truly impressive. Floor, washrooms and machines always maintained.'],['Kishfa Queen','Civil Lines','It helped me lose weight. A year in, I have seen a lot of change.'],['Akash Kumar Yadav','Tagore Town','Sakib bhaiya genuinely cares about your progress. Great form corrections.'],['Ayush Singh','Tagore Town','Charlie is very professional and always helps with proper guidance.'],['Vivek Srivastava','Civil Lines','The growth and upgrades over time show their commitment to members.']];

/* competition plates: kg, colour, drawn height, drawn width */
const PLATES=[[25,'#d2311f',124,16],[20,'#2f62b0',124,14],[15,'#d9b43a',108,12],[10,'#3b8a4e',92,10],[5,'#e8e2d6',62,8],[2.5,'#2a2423',50,6],[1.25,'#b9bcc2',42,5]];
function loadBar(target,collars){const bar=20+(collars?5:0);const out=[];if(target<bar)return{ok:false,plates:[],side:0,actual:bar};let rem=Math.round((target-bar)/2*100)/100;for(const p of PLATES){while(rem>=p[0]-1e-9){out.push(p);rem=Math.round((rem-p[0])*100)/100}}const side=out.reduce((a,p)=>a+p[0],0);return{ok:rem<1e-9,plates:out,side,actual:bar+side*2}}

  const ps=Array.from({length:170},()=>({x:W/2+(Math.random()-.5)*W*.25,y:H*.38,vx:(Math.random()-.5)*24*d,vy:(-Math.random()*22-6)*d,r:(4+Math.random()*6)*d,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.4}));let t=0;

function HeroScrub({me,openLogin}){

    const draw=()=>{let k=-1;for(let d=0;d<N&&k<0;d++){if(want-d>=0&&ok[want-d])k=want-d;else if(want+d<N&&ok[want+d])k=want+d}if(k<0||k===cur)return;cur=k;const im=imgs[k];const s=Math.max(c.width/im.naturalWidth,c.height/im.naturalHeight);const dw=im.naturalWidth*s,dh=im.naturalHeight*s;const fx=c.width<1100?.66:.6;ctx.drawImage(im,Math.min(0,Math.max(c.width-dw,c.width/2-dw*fx)),(c.height-dh)/2,dw,dh)};
    const size=()=>{const r=c.getBoundingClientRect();const d=Math.min(window.devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);cur=-1;draw()};
    const load=i=>new Promise(r=>{const im=new Image();im.decoding='async';im.onload=()=>{if(!dead){imgs[i]=im;ok[i]=true;draw()}r()};im.onerror=r;im.src='site/frames/f_'+String(i+1).padStart(3,'0')+'.webp'});
    const order=[0];for(let st=16;st>=1;st>>=1)for(let i=0;i<N;i+=st)if(!order.includes(i))order.push(i);let p=0;const next=()=>{if(dead||p>=order.length)return;load(order[p++]).then(next)};
    const onScroll=()=>{const w=wrap.current;if(!w||!sc)return;const hero=w.firstElementChild;const wr=w.getBoundingClientRect(),mr=sc.getBoundingClientRect();const top=parseFloat(getComputedStyle(hero).top)||0;const pr=Math.max(0,Math.min(1,(mr.top+top-wr.top)/Math.max(1,wr.height-hero.offsetHeight)));
      want=Math.round(pr*(N-1));draw();if(inR.current){inR.current.style.opacity=Math.max(0,1-pr*2.4);inR.current.style.transform='translateY('+(-pr*90)+'px)'}

function Focus({me,dow,up,close,onFinish}){

  const total=day.ex.reduce((a,e)=>a+e.s,0),cnt=Object.values(L).reduce((a,arr)=>a+arr.filter(Boolean).length,0);const e=ei>=0?day.ex[ei]:null;

    <div class="g2 st" style="align-items:start">
      <div class="stack">
        <div class="card hot"><div class="row between"><div><span class="k brass">Current plan</span><div class="big" style="margin-top:8px">${me.plan.name}</div><div class="muted" style="margin-top:6px">${fmtD(me.plan.start)} – ${fmtD(me.plan.end)}</div></div><${Ring} v=${Math.max(0,left)/span} size=${92}><b class="num" style="font:900 28px/1 var(--f-d)">${Math.max(0,left)}</b><span class="k" style="font-size:8.5px">days left</span><//></div>
          <div class="row wrap" style="gap:8px"><span class="pill">Tagore Town</span><span class="pill">Civil Lines</span><span class="pill">Free workout chart</span><span class="pill">Free diet plan</span></div></div>
        <div class="card"><div class="row between wrap"><div><b>Freeze membership</b><div class="muted" style="font-size:13px">Pause 7 days at a time, up to 15. Used ${me.plan.frozen}.</div></div><button class="btn sm ghost" onClick=${freeze}>${I('snow',14)} Freeze</button></div></div>
        <div class="card"><span class="k">Payments</span><div class="list">${me.payments.map(p=>html`<div class="li"><div class="t"><b>${p.what}</b><small>${fmtDL(p.d)} · ${p.mode}</small></div><b class="num">${inr(p.amt)}</b></div>`)}</div></div>
      </div>
      <div class="card"><span class="k">Renew or upgrade</span>
        <div class="g2">${PLANS.map(p=>html`<button class=${'card '+(pick===p.id?'hot':'')} style="padding:14px" aria-pressed=${pick===p.id} onClick=${()=>setPick(p.id)}><span class="k">${p.name}</span><span class="num" style="font:900 28px/1 var(--f-d)">${inr(p.price)}</span></button>`)}</div>
        <button class="btn full" disabled=${!pick} onClick=${renew}>Pay with UPI (demo)</button><span class="demo-flag">Demo only · in the live app this opens UPI or card payment</span></div>
    </div>
  </div>`;
}

/* ================= TRAINER ================= */
function CoachMembers({S,up,say}){
  const [mid,setMid]=useState(null);const [q,setQ]=useState('');const [mine,setMine]=useState(false);const tid=S.session.tid;
  const m=mid&&S.members.find(x=>x.id===mid);if(m)return html`<${MemberEdit} S=${S} up=${up} say=${say} m=${m} back=${()=>setMid(null)}/>`;
  const list=S.members.filter(x=>(!mine||x.trainer===tid)&&x.name.toLowerCase().includes(q.toLowerCase()));
  return html`<div class="stack view" style="gap:16px">
    <div class="row between wrap"><div><span class="k">Coach · ${BR[TR[tid].branch].name}</span><h1 class="h1" style="font-size:clamp(40px,5vw,64px)">Members</h1></div><div class="row" style="gap:10px"><div class="card" style="padding:12px 16px"><span class="k">Total</span><b class="big num" style="font-size:30px">${S.members.length}</b></div><div class="card" style="padding:12px 16px"><span class="k">Expiring</span><b class="big num" style="font-size:30px;color:var(--warn)">${S.members.filter(x=>daysBetween(TODAY,x.plan.end)<=7).length}</b></div></div></div>
    <div class="row wrap"><div class="input" style="flex:1 1 240px"><input id="srch" placeholder="Search members" aria-label="Search members" value=${q} onInput=${e=>setQ(e.target.value)}/></div><div class="seg" role="group" aria-label="Filter"><button aria-pressed=${!mine} onClick=${()=>setMine(false)}>All</button><button aria-pressed=${mine} onClick=${()=>setMine(true)}>My members</button></div></div>
    <div class="g2 st">${list.map(x=>{const left=daysBetween(TODAY,x.plan.end);const last=[...x.attendance].sort().pop();return html`<button class="mtile" onClick=${()=>setMid(x.id)}><div class="avatar">${x.name.split(' ').map(n=>n[0]).join('')}</div><div style="min-width:0"><b style="display:block">${x.name}</b><small class="muted">${GOALS[x.goal.type]} · ${BR[x.branch].name} · last in ${last?fmtD(last):'—'}</small></div><span class=${'pill '+(left<=7?'warn':'')}>${left<=0?'Expired':left<=7?left+'d left':TR[x.trainer].name}</span></button>`})}</div>
    ${!list.length&&html`<p class="muted">No members match that search.</p>`}
  </div>`;
}
function MemberEdit({S,up,say,m,back}){
  const [tpl,setTpl]=useState(null);const [t,setT]=useState('workout');const [dow,setDow]=useState(DOW[nowIST().getDay()]==='Sun'?'Mon':DOW[nowIST().getDay()]);const [note,setNote]=useState('');
  const day=m.split[dow];const ed=fn=>up(s=>fn(s.members.find(x=>x.id===m.id)));
  return html`<div class="stack view" style="gap:16px">
    <div class="row wrap"><button class="iconbtn" aria-label="Back to members" onClick=${back}>${I('back',20)}</button><div><span class="k">${GOALS[m.goal.type]} · target ${m.goal.target} kg · ${m.plan.name} till ${fmtD(m.plan.end)}</span><h1 class="h1" style="font-size:clamp(36px,4.4vw,56px)">${m.name}</h1></div></div>
    <div class="seg" role="group" aria-label="Section" style="align-self:start">${[['workout','Workout plan'],['diet','Diet chart'],['progress','Progress'],['note','Send note']].map(([k,l])=>html`<button aria-pressed=${t===k} onClick=${()=>setT(k)}>${l}</button>`)}</div>
    ${t==='workout'&&html`<div class="card stack">
      <div class="daystrip" role="group" aria-label="Day">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>html`<button aria-pressed=${d===dow} onClick=${()=>setDow(d)}>${d}<b style="font-size:13px">${m.split[d].ex.length}</b></button>`)}</div>
      <div class="row wrap" style="gap:8px"><span class="k">Apply a template</span>${Object.entries(TEMPLATES).map(([k,[l]])=>html`<button class="pill" style="cursor:pointer" onClick=${()=>setTpl(k)}>${l}</button>`)}</div>
      <label class="field" for="dayT"><span>Session name</span><div class="input"><input id="dayT" value=${day.t} onInput=${e=>{const v=e.target.value;ed(x=>x.split[dow].t=v)}}/></div></label>
      <div class="edit-ex"><span class="hd">Exercise</span><span class="hd">Sets</span><span class="hd">Reps</span><span class="hd">kg</span><span></span></div>
      ${day.ex.map((e,i)=>html`<div class="edit-ex"><input aria-label="Exercise name" value=${e.n} onInput=${ev=>{const v=ev.target.value;ed(x=>x.split[dow].ex[i].n=v)}}/><input aria-label="Sets" inputmode="numeric" value=${e.s} onInput=${ev=>{const v=Math.max(1,Math.min(10,parseInt(ev.target.value)||1));ed(x=>x.split[dow].ex[i].s=v)}}/><input aria-label="Reps" value=${e.r} onInput=${ev=>{const v=ev.target.value;ed(x=>x.split[dow].ex[i].r=v)}}/><input aria-label="Weight in kg" inputmode="decimal" value=${e.kg} onInput=${ev=>{const v=parseFloat(ev.target.value)||0;ed(x=>x.split[dow].ex[i].kg=v)}}/><button class="x-btn" aria-label=${'Remove '+e.n} onClick=${()=>ed(x=>x.split[dow].ex.splice(i,1))}>${I('x',14)}</button></div>`)}
      <div class="row wrap"><button class="btn ghost" onClick=${()=>ed(x=>{x.split[dow].ex.push(E('New exercise',3,'10',0));if(x.split[dow].t==='Rest')x.split[dow].t='Session'})}>${I('plus',16)} Add exercise</button><button class="btn" onClick=${()=>say('Plan saved · '+m.name.split(' ')[0]+' sees it now')}>Save plan</button></div></div>`}
    ${t==='diet'&&html`<div class="stack"><div class="g2 st">${m.diet.map((d,i)=>html`<div class="card" style="gap:8px">
      <div class="row between"><input aria-label="Meal name" class="k brass" style="background:none;border:0;outline:none;flex:1;min-width:0" value=${d.t} onInput=${e=>{const v=e.target.value;ed(x=>x.diet[i].t=v)}}/><button class="x-btn" aria-label="Remove meal" onClick=${()=>ed(x=>x.diet.splice(i,1))}>${I('x',14)}</button></div>
      <div class="input"><input aria-label="Foods" value=${d.items} onInput=${e=>{const v=e.target.value;ed(x=>x.diet[i].items=v)}}/></div>
      <div class="g2"><div class="input"><input aria-label="Time" type="time" value=${d.time} onInput=${e=>{const v=e.target.value;ed(x=>x.diet[i].time=v)}}/></div><div class="input"><input aria-label="Protein grams" inputmode="numeric" value=${d.p} onInput=${e=>{const v=parseInt(e.target.value)||0;ed(x=>x.diet[i].p=v)}}/><em>g</em></div></div></div>`)}</div>
      <div class="row wrap"><button class="btn ghost" onClick=${()=>ed(x=>x.diet.push({t:'Snack',time:'16:00',items:'Roasted chana',p:8}))}>${I('plus',16)} Add meal</button><button class="btn" onClick=${()=>say('Diet chart saved for '+m.name.split(' ')[0])}>Save diet</button></div></div>`}
    ${t==='progress'&&html`<div class="g2 st"><div class="card"><span class="k">Weight trend</span><${WeightChart} pts=${m.weights} target=${m.goal.target}/></div><div class="card"><span class="k">Consistency</span><b class="big num">${m.attendance.filter(d=>d.slice(0,7)===TODAY.slice(0,7)).length}</b><span class="muted">visits this month · ${streak(m.attendance)}-day streak</span></div></div>`}
    ${t==='note'&&html`<div class="g2 st" style="align-items:start"><div class="card stack"><label class="field" for="noteTa"><span>Message to ${m.name.split(' ')[0]}</span><textarea id="noteTa" class="ta" placeholder="Great session today. Add 2.5 kg on squats next week." value=${note} onInput=${e=>setNote(e.target.value)}></textarea></label>
      <button class="btn full" disabled=${!note.trim()} onClick=${()=>{ed(x=>x.notes.unshift({from:S.session.tid,d:TODAY,text:note.trim()}));setNote('');say('Note sent · shows on their Today screen')}}>Send note</button></div>
      <div class="card"><span class="k">Sent notes</span><div class="list">${m.notes.map(n=>html`<div class="li"><div class="t"><b style="font-weight:500">${n.text}</b><small>Coach ${TR[n.from].name} · ${fmtD(n.d)}</small></div></div>`)}</div></div></div>`}
    ${tpl&&html`<${Sheet} close=${()=>setTpl(null)} label="Apply template"><div class="stack"><h3 class="h3">Apply ${TEMPLATES[tpl][0]}?</h3><p class="muted" style="margin:0">This replaces ${m.name.split(' ')[0]}'s whole week. Workouts already logged stay in their history.</p><button class="btn full" onClick=${()=>{const name=TEMPLATES[tpl][0],tp=TEMPLATES[tpl][1];ed(x=>{x.split=JSON.parse(JSON.stringify(tp));delete x.logs[TODAY]});setTpl(null);say(name+' applied · '+m.name.split(' ')[0]+' sees it now')}}>Replace the week</button><button class="btn ghost full" onClick=${()=>setTpl(null)}>Cancel</button></div><//>`}
  </div>`;
}
function Floor({S}){
  const up=S.members.flatMap(x=>x.bookings.filter(b=>b.d>=TODAY).map(b=>({...b,name:x.name})));
  return html`<div class="stack view" style="gap:16px">
    <div><span class="k">${fmtDL(TODAY)}</span><h1 class="h1" style="font-size:clamp(40px,5vw,64px)">Floor</h1></div>
    <div class="g2 st">${Object.entries(BR).map(([k,b])=>{const o=openNow(k);return html`<div class="card"><div class="row between"><b class="h3">${b.name}</b><span class=${'pill '+(o.open?'ok':'')}>${o.txt}</span></div><span class="big num">${S.members.filter(x=>x.branch===k&&x.attendance.includes(TODAY)).length}</span><span class="muted">checked in today</span></div>`})}</div>
    <div class="g2 st" style="align-items:start">
      <div class="card"><span class="k">Upcoming slot bookings</span><div class="list">${up.length?up.sort((a,b)=>a.d<b.d?-1:1).map(b=>html`<div class="li"><div class="t"><b>${b.name}</b><small>${fmtDL(b.d)} · ${b.slot} · ${BR[b.branch].name}</small></div></div>`):html`<div class="li"><div class="t"><small>No bookings yet</small></div></div>`}</div></div>
      <div class="card"><span class="k">Renewals due</span><div class="list">${S.members.filter(x=>daysBetween(TODAY,x.plan.end)<=14).map(x=>html`<div class="li"><div class="t"><b>${x.name}</b><small>${x.plan.name} ends ${fmtD(x.plan.end)}</small></div><a class="btn sm ghost" href=${'https://wa.me/91'+x.phone.replace(/\D/g,'')+'?text='+encodeURIComponent('Hi '+x.name.split(' ')[0]+', your Weight Date membership ends on '+fmtD(x.plan.end)+'. Renew at the desk or in the app.')} target="_blank" rel="noopener">Remind</a></div>`)}</div></div>
    </div>
  </div>`;
}

render(html`<${App}/>`,document.getElementById('root'));
})();
</script>
